# Electron 打包配置
# 打包前会先跑 scripts/build-package.mjs，产出 dist-package/app/（server.mjs + web + resources）

appId: com.corpus.app
productName: Corpus
copyright: Copyright © 2026 Corpus

directories:
    output: dist-package/electron

# Electron 二进制走国内镜像（默认从 github releases 拉，几十 KB/s）
electronDownload:
    mirror: https://npmmirror.com/mirrors/electron/
    # nsis / winCodeSign 等工具链镜像走 ELECTRON_BUILDER_BINARIES_MIRROR 环境变量，
    # scripts/build.mjs 里已设置默认值

# 只打壳：server 与前端作为 extraResources 放进去，不走 asar 内的 node_modules
files:
    - package.json
    - packages/shell/main.mjs
    - packages/shell/preload.cjs

extraResources:
    - from: dist-package/app/server.mjs
      to: server.mjs
    - from: dist-package/app/web
      to: web
    - from: dist-package/app/resources
      to: resources

win:
    target:
        - target: nsis
          arch: [x64]
    artifactName: Corpus-${version}-setup.${ext}

nsis:
    # 装到用户目录（默认 %LOCALAPPDATA%\Programs），程序目录可写，
    # data/ 才能放在安装目录旁边；装到 Program Files 时程序会自动回退到 %LOCALAPPDATA%
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    # 装完不自动启动：应用一启动就会占用安装目录里的 exe，
    # 紧接着再装一次就会被 NSIS 判定为「无法关闭 Corpus」
    runAfterFinish: false
    # 覆盖默认的「应用正在运行」检测，见 scripts/nsis/custom.nsh
    include: scripts/nsis/custom.nsh
    createDesktopShortcut: true
    createStartMenuShortcut: true
    shortcutName: Corpus
